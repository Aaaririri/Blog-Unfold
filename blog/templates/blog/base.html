<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meu Blog{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:1rem;line-height:1.6;color:#222}
    nav{display:flex;gap:1rem;border-bottom:1px solid #ddd;padding-bottom:.5rem;margin-bottom:1.5rem}
    nav a{text-decoration:none;font-weight:600}
    img{max-width:100%;height:auto;border-radius:6px}
    .meta{color:#666;font-size:.9rem}
  </style>
</head>
<body>
  <nav><a href="{% url 'blog:lista' %}">Posts</a><a href="{% url 'curriculo:pagina' %}">Currículo</a><a href="{% url 'estudos:pagina' %}">Estudos</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
