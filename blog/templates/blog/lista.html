{% extends 'blog/base.html' %}
{% block content %}
{% for post in posts %}
  <article>
    {% if post.capa %}<img src="{{ post.capa.url }}" alt="{{ post.titulo }}">{% endif %}
    <h2><a href="{{ post.get_absolute_url }}">{{ post.titulo }}</a></h2>
    <p class="meta">{{ post.publicado_em|date:"d/m/Y" }}</p>
    <p>{{ post.resumo }}</p>
  </article>
{% empty %}
  <p>Nenhum post publicado ainda.</p>
{% endfor %}
{% endblock %}
